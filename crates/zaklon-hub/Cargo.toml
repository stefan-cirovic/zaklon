[package]
name = "zaklon-hub"
description = "The Zaklon hub: local API, pairing, discovery and static UI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "zaklon_hub"
path = "src/lib.rs"

[[bin]]
name = "zaklon-hub"
path = "src/main.rs"

[dependencies]
zaklon-core = { path = "../zaklon-core" }
zaklon-pake = { path = "../zaklon-pake" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
sha2.workspace = true
sha1.workspace = true
base64.workspace = true
uuid.workspace = true
rand.workspace = true
axum = { version = "0.8", features = ["json", "macros"] }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tower-http = { version = "0.6", features = ["trace", "fs"] }
tower = { version = "0.5", features = ["util"] }
rust-embed = { version = "8", features = ["include-exclude"] }
mime_guess = "2"
mdns-sd = "0.13"
local-ip-address = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = "0.3"
url = "2"
tokio-util = { version = "0.7", features = ["io"] }
lol_html = "2"
fs4 = { version = "0.12", features = ["sync"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
age = "0.11"
bytes = "1"
# Reads the map's tile archives (PMTiles) for the Zaklon map. The feature
# brings the async reader; the files are read with our own positioned reads.
pmtiles = { version = "0.24", default-features = false, features = ["mmap-async-tokio"] }

[dev-dependencies]
# A paused clock, for tests of time limits.
tokio = { workspace = true, features = ["test-util"] }
# Tiny map archives written by the tests.
pmtiles = { version = "0.24", default-features = false, features = ["mmap-async-tokio", "write"] }
flate2 = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Power", "Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_SystemInformation", "Win32_System_Registry"] }
