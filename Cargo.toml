[workspace]
resolver = "2"
members = ["crates/zaklon-core", "crates/zaklon-hub", "apps/zaklon/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/stefan-cirovic/zaklon"
authors = ["Zaklon contributors"]

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "time", "sync", "signal", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
rand = "0.8"
sha2 = "0.10"
sha1 = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros", "local-offset"] }
argon2 = "0.5"
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring", "crypto"] }

# Checksums of multi-gigabyte files: keep them fast in debug builds too.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.sha1]
opt-level = 3
# scrypt, which locks the backup key with the household password: seconds
# instead of a fraction of one in debug builds and tests otherwise.
[profile.dev.package.scrypt]
opt-level = 3
[profile.dev.package.salsa20]
opt-level = 3

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
