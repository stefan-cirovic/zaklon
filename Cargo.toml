[workspace]
resolver = "2"
members = ["crates/zaklon-core", "crates/zaklon-hub", "apps/zaklon/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/stefan-cirovic/zaklon"
authors = ["Zaklon contributors"]

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "time", "sync", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
argon2 = "0.5"
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring", "crypto"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
