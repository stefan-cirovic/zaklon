name: CI

# Also run by the release workflow before it builds anything.

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Third-party actions are pinned to a commit (the tag it had when pinned is in the comment).
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Build the interface (type check included)
        run: pnpm --filter ui build

      - name: Clippy
        run: cargo clippy -p zaklon-core -p zaklon-pake -p zaklon-hub -p zaklon-app --all-targets -- -D warnings

      - name: Unit and hub end-to-end tests
        run: cargo test -p zaklon-core -p zaklon-pake -p zaklon-hub

      - name: Desktop app tests
        run: cargo test -p zaklon-app

      - name: Build the hub for interface tests
        run: cargo build -p zaklon-hub

      - name: Interface end-to-end tests (Edge)
        run: pnpm --filter ui e2e

      - name: Keep Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: ui/test-results
