name: Release

# Builds the phone app and the Windows installer that carries it, and makes a
# DRAFT GitHub release with both files and their SHA-256 checksums. Nothing
# is published until someone reviews the draft and publishes it by hand.
#
# Runs on a version tag (v0.2.0) or by hand from the Actions tab. The same
# checks as CI must pass first.
#
# Not yet: a release-signed phone app (needs the project's signing key as a
# secret) and a signed Windows installer (planned with SignPath). Until then
# the phone app is the debug-signed build.
#
# The token can only read the repository, except in the last job, which
# only uploads the finished files. Third-party actions are pinned to a
# commit (the tag it had when pinned is in the comment).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# The commit the system specification (Settings › About) names; each build
# job adds the day (see crates/zaklon-hub/build.rs and ui/vite.config.ts).
env:
  ZAKLON_BUILD_COMMIT: ${{ github.sha }}

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  android:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NDK_VERSION: 27.1.12297006
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build date
        run: echo "ZAKLON_BUILD_DATE=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub's Ubuntu machines come with the Android SDK (ANDROID_HOME).
      - name: Android NDK and platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: JavaScript dependencies
        run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: On-device AI engine (llama.cpp for Android)
        run: bash scripts/fetch-android-llama.sh

      - name: Build the phone app
        run: pnpm tauri android build --debug --target aarch64

      - uses: actions/upload-artifact@v4
        with:
          name: phone-app
          path: apps/zaklon/src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk

  windows:
    needs: android
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build date
        shell: bash
        run: echo "ZAKLON_BUILD_DATE=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: JavaScript dependencies
        run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - uses: actions/download-artifact@v4
        with:
          name: phone-app
          path: phone-app

      - name: Put the phone app inside the installer
        shell: bash
        run: cp phone-app/app-universal-debug.apk apps/zaklon/src-tauri/windows/zaklon.apk

      - name: Build the Windows installer
        run: pnpm tauri build

      - name: Collect files and checksums
        shell: bash
        run: |
          mkdir out
          cp target/release/bundle/nsis/*-setup.exe out/
          cp phone-app/app-universal-debug.apk out/zaklon.apk
          cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: out/

  draft:
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: out

      - name: Draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: true
          name: ${{ github.ref_type == 'tag' && github.ref_name || format('Build {0}', github.run_number) }}
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
          # A draft published later is tagged on the commit that was built, not on main's newest commit.
          target_commitish: ${{ github.sha }}
          files: out/*
          body: |
            Draft made by the release workflow. Check it, write the notes, then publish.

            - `Zaklon_*_x64-setup.exe`: Windows installer (works offline; includes the phone app).
            - `zaklon.apk`: the Android app (test build, debug-signed).
            - `SHA256SUMS.txt`: checksums of both.
