[package]
name = "zaklon-app"
description = "Zaklon desktop window and Android app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "zaklon_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util"] }
tracing.workspace = true
tracing-subscriber.workspace = true
sha2.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-manual-roots", "json", "stream"] }
futures-util = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rand.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query"] }
tauri-plugin-opener = "2"
# Pairing with a hub found on the network (the phone side of it).
zaklon-pake = { path = "../../../crates/zaklon-pake" }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
zaklon-hub = { path = "../../../crates/zaklon-hub" }
tauri-plugin-single-instance = "2"
tracing-appender.workspace = true

# Waiting for the previous copy to end when Zaklon restarts itself, and the
# "Start with Windows" entry in the registry.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Registry", "Win32_Security"] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"
