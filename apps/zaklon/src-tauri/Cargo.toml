[package]
name = "zaklon-app"
description = "Zaklon desktop window and Android app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "zaklon_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sha2.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-manual-roots", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rand.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
zaklon-hub = { path = "../../../crates/zaklon-hub" }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"
